openapi: 3.1.0
jsonSchemaDialect: https://json-schema.org/draft/2020-12/schema
info:
  title: SentinelPipe Control Plane API
  version: 1.2.0-m3.1
  summary: Organizations, memberships, projects and security scan requests.
  description: |
    Domain REST API of the SentinelPipe control plane (Milestone 2, Phase 2A).

    **Authentication.** Every operation requires an OAuth 2.0 bearer access token
    (JWT) issued by the configured external OIDC provider. Tokens must be signed
    with an asymmetric algorithm, have the configured issuer and audience, an
    `exp` claim, and the `typ` header `at+jwt` (configurable). Invalid or missing
    tokens yield `401` without stating the reason.

    **Authorization.** Access is decided by server-side organization memberships
    (OWNER, ADMIN, MEMBER, VIEWER) for the token's issuer and subject; role or
    organization claims inside tokens are ignored. Callers who are not members
    of the owning organization receive `404`, exactly as for nonexistent
    resources, so UUIDs cannot be used to probe other tenants. Members whose
    role is insufficient receive `403` with a `code`. Only configured platform
    administrators can create organizations; the creator becomes OWNER.

    | Operation | OWNER | ADMIN | MEMBER | VIEWER |
    |---|---|---|---|---|
    | View organization, projects, scans | yes | yes | yes | yes |
    | Request scan | yes | yes | yes | no |
    | Cancel scan | yes | yes | yes | no |
    | Register project | yes | yes | no | no |
    | List members | yes | yes | no | no |
    | Grant / change / revoke OWNER, ADMIN | yes | no | no | no |
    | Grant / change / revoke MEMBER, VIEWER | yes | yes | no | no |

    Nobody can change or revoke their own membership.

    **Deployment status.** The API is disabled by default and can currently only
    be enabled with a literal loopback `server.address` (ADR-0002, ADR-0003).

    Conventions:
    - JSON properties use camelCase. Timestamps are UTC RFC 3339 strings with
      microsecond precision. Identifiers are server-generated UUIDs.
    - Unknown request properties are rejected with `400`.
    - Errors use RFC 9457 Problem Details (`application/problem+json`).
    - Collections use zero-based offset pagination (`page`, `size` <= 100).
    - Execution transitions (claiming, heartbeats, results, recovery, evaluation)
      are not exposed over HTTP: they belong to authenticated workers and the
      control-plane supervisor, through the database execution protocol
      (ADR-0007). The only user-facing transition is cancellation.
    - `executionStatus` and `securityDecision` are independent. Completing
      execution never implies `PASS`; without a policy evaluation a completed
      scan is `INCOMPLETE`, and `decisionReason` says why.
servers:
  - url: http://127.0.0.1:8080
    description: Local development (loopback only, `local` profile)
security:
  - bearerAuth: []
tags:
  - name: Identity
  - name: Organizations
  - name: Memberships
  - name: Projects
  - name: Scans

paths:
  /api/v1/organizations:
    post:
      tags: [Organizations]
      operationId: createOrganization
      summary: Register an organization
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '../schemas/v1/create-organization-request.schema.json'
            example:
              name: Acme Security
              slug: acme-security
      responses:
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '201':
          description: Organization created.
          headers:
            Location:
              $ref: '#/components/headers/Location'
          content:
            application/json:
              schema:
                $ref: '../schemas/v1/organization.schema.json'
              example:
                id: 0b8f6a0e-6f2b-4d55-9a8b-2c0c4b3f1d10
                name: Acme Security
                slug: acme-security
                createdAt: '2026-10-09T12:00:00.123456Z'
                updatedAt: '2026-10-09T12:00:00.123456Z'
        '400':
          $ref: '#/components/responses/BadRequest'
        '409':
          $ref: '#/components/responses/Conflict'

  /api/v1/organizations/{organizationId}:
    parameters:
      - $ref: '#/components/parameters/OrganizationId'
    get:
      tags: [Organizations]
      operationId: getOrganization
      summary: Get an organization
      responses:
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '200':
          description: The organization.
          content:
            application/json:
              schema:
                $ref: '../schemas/v1/organization.schema.json'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'

  /api/v1/organizations/{organizationId}/projects:
    parameters:
      - $ref: '#/components/parameters/OrganizationId'
    post:
      tags: [Projects]
      operationId: createProject
      summary: Register a GitHub repository as a project
      description: |
        The repository is identified by owner and name only; URLs are not
        accepted. Owner and name are normalized to lowercase. A repository can be
        registered once per organization (case-insensitive). No repository is
        cloned or executed.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '../schemas/v1/create-project-request.schema.json'
            example:
              name: Payments Service
              repositoryProvider: GITHUB
              repositoryOwner: Acme-Corp
              repositoryName: payments-service
              defaultBranch: main
      responses:
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '201':
          description: Project created.
          headers:
            Location:
              $ref: '#/components/headers/Location'
          content:
            application/json:
              schema:
                $ref: '../schemas/v1/project.schema.json'
              example:
                id: 6d1f0a52-3c1e-4b8e-8f0e-1a2b3c4d5e6f
                organizationId: 0b8f6a0e-6f2b-4d55-9a8b-2c0c4b3f1d10
                name: Payments Service
                repositoryProvider: GITHUB
                repositoryOwner: acme-corp
                repositoryName: payments-service
                defaultBranch: main
                enabled: true
                createdAt: '2026-10-09T12:01:00.000001Z'
                updatedAt: '2026-10-09T12:01:00.000001Z'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
    get:
      tags: [Projects]
      operationId: listProjects
      summary: List the projects of an organization
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Size'
      responses:
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '200':
          description: A page of projects, oldest first.
          content:
            application/json:
              schema:
                $ref: '../schemas/v1/project-page.schema.json'
              example:
                items:
                  - id: 6d1f0a52-3c1e-4b8e-8f0e-1a2b3c4d5e6f
                    organizationId: 0b8f6a0e-6f2b-4d55-9a8b-2c0c4b3f1d10
                    name: Payments Service
                    repositoryProvider: GITHUB
                    repositoryOwner: acme-corp
                    repositoryName: payments-service
                    defaultBranch: main
                    enabled: true
                    createdAt: '2026-10-09T12:01:00.000001Z'
                    updatedAt: '2026-10-09T12:01:00.000001Z'
                page:
                  number: 0
                  size: 20
                  totalElements: 1
                  totalPages: 1
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'

  /api/v1/projects/{projectId}:
    parameters:
      - $ref: '#/components/parameters/ProjectId'
    get:
      tags: [Projects]
      operationId: getProject
      summary: Get a project
      responses:
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '200':
          description: The project.
          content:
            application/json:
              schema:
                $ref: '../schemas/v1/project.schema.json'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'

  /api/v1/projects/{projectId}/scans:
    parameters:
      - $ref: '#/components/parameters/ProjectId'
    post:
      tags: [Scans]
      operationId: requestScan
      summary: Queue a security scan of one commit
      description: |
        Queues a scan; it does not perform one. The response is `202 Accepted`
        with the scan in `QUEUED` / `PENDING` state.

        **Idempotency.** Send an `Idempotency-Key` to make retries safe. Keys are
        scoped to the project and enforced by a database unique constraint:
        - same key and same request: the original scan is returned again
          (`Idempotent-Replayed: true`, current state of that scan);
        - same key with a different request: `422`;
        - concurrent requests with the same key create at most one scan.

        Requests without a key always create a new scan. Keys do not expire yet.
      parameters:
        - name: Idempotency-Key
          in: header
          required: false
          schema:
            type: string
            minLength: 1
            maxLength: 128
            pattern: '^[A-Za-z0-9._:-]{1,128}$'
          example: gh-run-123456789-attempt-1
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '../schemas/v1/scan-request.schema.json'
            example:
              commitSha: 4f2c8e1d9b7a6c5e3f1a2b4c6d8e0f1a3b5c7d9e
              branch: feature/login
              triggerType: PULL_REQUEST
      responses:
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '202':
          description: Scan queued (or an idempotent replay of an earlier request).
          headers:
            Location:
              $ref: '#/components/headers/Location'
            Idempotent-Replayed:
              description: '`true` when the response replays an earlier request with the same Idempotency-Key.'
              schema:
                type: string
                enum: ['true', 'false']
          content:
            application/json:
              schema:
                $ref: '../schemas/v1/scan.schema.json'
              example:
                id: 9a7e5c3b-1d2f-4a6b-8c0d-2e4f6a8b0c1d
                projectId: 6d1f0a52-3c1e-4b8e-8f0e-1a2b3c4d5e6f
                commitSha: 4f2c8e1d9b7a6c5e3f1a2b4c6d8e0f1a3b5c7d9e
                branch: feature/login
                triggerType: PULL_REQUEST
                executionStatus: QUEUED
                securityDecision: PENDING
                decisionReason: null
                requestedAt: '2026-10-09T12:02:00.5Z'
                startedAt: null
                deadlineAt: null
                completedAt: null
                jobs: []
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          description: The Idempotency-Key was already used for a different request.
          content:
            application/problem+json:
              schema:
                $ref: '../schemas/v1/problem-details.schema.json'
              example:
                type: urn:sentinelpipe:problem:idempotency-key-reused
                title: Idempotency key reused
                status: 422
                detail: The Idempotency-Key was already used for a different request.
                instance: /api/v1/projects/6d1f0a52-3c1e-4b8e-8f0e-1a2b3c4d5e6f/scans
    get:
      tags: [Scans]
      operationId: listScans
      summary: List the scans of a project
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Size'
      responses:
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '200':
          description: A page of scans, newest first.
          content:
            application/json:
              schema:
                $ref: '../schemas/v1/scan-page.schema.json'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'

  /api/v1/projects/{projectId}/scans/{scanId}/cancel:
    parameters:
      - $ref: '#/components/parameters/ProjectId'
      - name: scanId
        in: path
        required: true
        schema:
          type: string
          format: uuid
    post:
      tags: [Scans]
      operationId: cancelScan
      summary: Cancel a scan
      description: |
        Cancels a scan that has not finished (MEMBER or above). The scan becomes
        `CANCELLED` with decision `INCOMPLETE` (`decisionReason: CANCELLED_BY_USER`)
        and its unfinished jobs are cancelled. A worker executing one of them is
        told on its next heartbeat (within 15 seconds by default) and its result is
        rejected. The cancellation is audited with the caller's identity.

        Idempotent: cancelling a cancelled scan returns it unchanged. The scan must
        belong to the project in the path; otherwise, and for non-members, `404`.
        A `COMPLETED` or `FAILED` scan cannot be cancelled (`409`,
        `code: scan-not-cancellable`). No request body.
      responses:
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '200':
          description: The scan, now cancelled.
          content:
            application/json:
              schema:
                $ref: '../schemas/v1/scan.schema.json'
              example:
                id: 9a7e5c3b-1d2f-4a6b-8c0d-2e4f6a8b0c1d
                projectId: 6d1f0a52-3c1e-4b8e-8f0e-1a2b3c4d5e6f
                commitSha: 4f2c8e1d9b7a6c5e3f1a2b4c6d8e0f1a3b5c7d9e
                branch: feature/login
                triggerType: PULL_REQUEST
                executionStatus: CANCELLED
                securityDecision: INCOMPLETE
                decisionReason: CANCELLED_BY_USER
                requestedAt: '2026-10-09T12:02:00.5Z'
                startedAt: '2026-10-09T12:02:05Z'
                deadlineAt: '2026-10-09T12:17:05Z'
                completedAt: '2026-10-09T12:03:10Z'
                jobs:
                  - id: 3c5e7a9b-0d1f-4e2a-9b3c-5d7e9f1a3b5c
                    scanId: 9a7e5c3b-1d2f-4a6b-8c0d-2e4f6a8b0c1d
                    scannerType: FIXTURE
                    executionStatus: CANCELLED
                    attemptCount: 1
                    failureReason: null
                    createdAt: '2026-10-09T12:02:01Z'
                    startedAt: '2026-10-09T12:02:05Z'
                    completedAt: '2026-10-09T12:03:10Z'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'

  /api/v1/scans/{scanId}:
    parameters:
      - name: scanId
        in: path
        required: true
        schema:
          type: string
          format: uuid
    get:
      tags: [Scans]
      operationId: getScan
      summary: Get a scan and its scanner jobs
      responses:
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '200':
          description: The scan.
          content:
            application/json:
              schema:
                $ref: '../schemas/v1/scan.schema.json'
              example:
                id: 9a7e5c3b-1d2f-4a6b-8c0d-2e4f6a8b0c1d
                projectId: 6d1f0a52-3c1e-4b8e-8f0e-1a2b3c4d5e6f
                commitSha: 4f2c8e1d9b7a6c5e3f1a2b4c6d8e0f1a3b5c7d9e
                branch: feature/login
                triggerType: PULL_REQUEST
                executionStatus: COMPLETED
                securityDecision: FAIL
                decisionReason: POLICY_EVALUATED
                requestedAt: '2026-10-09T12:02:00.5Z'
                startedAt: '2026-10-09T12:02:05Z'
                deadlineAt: '2026-10-09T12:17:05Z'
                completedAt: '2026-10-09T12:04:30Z'
                jobs:
                  - id: 3c5e7a9b-0d1f-4e2a-9b3c-5d7e9f1a3b5c
                    scanId: 9a7e5c3b-1d2f-4a6b-8c0d-2e4f6a8b0c1d
                    scannerType: SEMGREP
                    executionStatus: COMPLETED
                    attemptCount: 1
                    failureReason: null
                    createdAt: '2026-10-09T12:02:01Z'
                    startedAt: '2026-10-09T12:02:06Z'
                    completedAt: '2026-10-09T12:04:00Z'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'

  /api/v1/me:
    get:
      tags: [Identity]
      operationId: getCurrentUser
      summary: Get the authenticated caller and their organization roles
      responses:
        '401':
          $ref: '#/components/responses/Unauthorized'
        '200':
          description: The caller's identity and server-side memberships.
          content:
            application/json:
              schema:
                $ref: '../schemas/v1/current-user.schema.json'
              example:
                issuer: https://idp.example.com/realms/sentinel
                subject: 8f14e45f-ceea-467a-9b36-0d3c3a2f1e11
                platformAdmin: false
                memberships:
                  - organizationId: 0b8f6a0e-6f2b-4d55-9a8b-2c0c4b3f1d10
                    role: ADMIN

  /api/v1/organizations/{organizationId}/members:
    parameters:
      - $ref: '#/components/parameters/OrganizationId'
    get:
      tags: [Memberships]
      operationId: listMemberships
      summary: List the members of an organization (OWNER, ADMIN)
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Size'
      responses:
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '200':
          description: A page of memberships, oldest first.
          content:
            application/json:
              schema:
                $ref: '../schemas/v1/membership-page.schema.json'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
    post:
      tags: [Memberships]
      operationId: grantMembership
      summary: Grant an organization role to a user (OWNER any role; ADMIN only MEMBER/VIEWER)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '../schemas/v1/create-membership-request.schema.json'
            example:
              subject: 8f14e45f-ceea-467a-9b36-0d3c3a2f1e11
              role: MEMBER
      responses:
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '201':
          description: Membership created.
          headers:
            Location:
              $ref: '#/components/headers/Location'
          content:
            application/json:
              schema:
                $ref: '../schemas/v1/membership.schema.json'
              example:
                id: 5b7d9f1a-3c5e-4a7b-9d1f-3a5c7e9b1d3f
                organizationId: 0b8f6a0e-6f2b-4d55-9a8b-2c0c4b3f1d10
                issuer: https://idp.example.com/realms/sentinel
                subject: 8f14e45f-ceea-467a-9b36-0d3c3a2f1e11
                role: MEMBER
                createdAt: '2026-10-09T12:03:00Z'
                updatedAt: '2026-10-09T12:03:00Z'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'

  /api/v1/organizations/{organizationId}/members/{membershipId}:
    parameters:
      - $ref: '#/components/parameters/OrganizationId'
      - $ref: '#/components/parameters/MembershipId'
    get:
      tags: [Memberships]
      operationId: getMembership
      summary: Get a membership (OWNER, ADMIN)
      responses:
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '200':
          description: The membership.
          content:
            application/json:
              schema:
                $ref: '../schemas/v1/membership.schema.json'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
    put:
      tags: [Memberships]
      operationId: changeMembershipRole
      summary: Change another member's role
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '../schemas/v1/update-membership-request.schema.json'
            example:
              role: VIEWER
      responses:
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '200':
          description: The updated membership.
          content:
            application/json:
              schema:
                $ref: '../schemas/v1/membership.schema.json'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
    delete:
      tags: [Memberships]
      operationId: revokeMembership
      summary: Revoke another member's membership
      responses:
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '204':
          description: Membership revoked.
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: |
        Access token (RFC 9068 `at+jwt` by default) from the configured OIDC
        provider, sent in the `Authorization` header only. Query-parameter and
        form-body tokens are not accepted.
  parameters:
    OrganizationId:
      name: organizationId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    MembershipId:
      name: membershipId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    ProjectId:
      name: projectId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    Page:
      name: page
      in: query
      required: false
      description: Zero-based page number.
      schema:
        type: integer
        minimum: 0
        maximum: 10000
        default: 0
    Size:
      name: size
      in: query
      required: false
      description: Page size.
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 20

  headers:
    Location:
      description: Relative URI of the created or queued resource.
      schema:
        type: string
        format: uri-reference

  responses:
    Unauthorized:
      description: Missing or invalid bearer token. The reason is never disclosed.
      headers:
        WWW-Authenticate:
          description: '`Bearer`, or `Bearer error="invalid_token"` when a token was presented.'
          schema:
            type: string
      content:
        application/problem+json:
          schema:
            $ref: '../schemas/v1/problem-details.schema.json'
          example:
            type: urn:sentinelpipe:problem:unauthorized
            title: Unauthorized
            status: 401
            detail: A valid bearer access token is required.
            instance: /api/v1/organizations
    Forbidden:
      description: |
        The caller is a member of the organization but their role does not permit
        the operation (`insufficient-role`, `role-escalation`,
        `self-modification`), or a non-administrator tried to create an
        organization (`platform-admin-required`). Non-members receive `404`.
      content:
        application/problem+json:
          schema:
            $ref: '../schemas/v1/problem-details.schema.json'
          example:
            type: urn:sentinelpipe:problem:forbidden
            title: Forbidden
            status: 403
            detail: Your organization role does not permit this operation.
