openapi: 3.1.0
jsonSchemaDialect: https://json-schema.org/draft/2020-12/schema
info:
  title: SentinelPipe Control Plane API
  version: 1.4.0-m4.2
  summary: Organizations, memberships, projects and security scan requests.
  description: |
    Domain REST API of the SentinelPipe control plane (Milestone 2, Phase 2A).

    **Authentication.** Every operation requires an OAuth 2.0 bearer access token
    (JWT) issued by the configured external OIDC provider. Tokens must be signed
    with an asymmetric algorithm, have the configured issuer and audience, an
    `exp` claim, and the `typ` header `at+jwt` (configurable). Invalid or missing
    tokens yield `401` without stating the reason.

    **Authorization.** Access is decided by server-side organization memberships
    (OWNER, ADMIN, MEMBER, VIEWER) for the token's issuer and subject; role or
    organization claims inside tokens are ignored. Callers who are not members
    of the owning organization receive `404`, exactly as for nonexistent
    resources, so UUIDs cannot be used to probe other tenants. Members whose
    role is insufficient receive `403` with a `code`. Only configured platform
    administrators can create organizations; the creator becomes OWNER.

    | Operation | OWNER | ADMIN | MEMBER | VIEWER |
    |---|---|---|---|---|
    | View organization, projects, scans | yes | yes | yes | yes |
    | Request scan | yes | yes | yes | no |
    | Cancel scan | yes | yes | yes | no |
    | Register project | yes | yes | no | no |
    | View policy versions, active policy, evaluations | yes | yes | yes | yes |
    | Create policy version | yes | yes | no | no |
    | Activate policy version for a project | yes | no | no | no |
    | Request historical re-evaluation of a scan | yes | yes | no | no |
    | List members | yes | yes | no | no |
    | Grant / change / revoke OWNER, ADMIN | yes | no | no | no |
    | Grant / change / revoke MEMBER, VIEWER | yes | yes | no | no |

    Nobody can change or revoke their own membership.

    **Deployment status.** The API is disabled by default and can currently only
    be enabled with a literal loopback `server.address` (ADR-0002, ADR-0003).

    Conventions:
    - JSON properties use camelCase. Timestamps are UTC RFC 3339 strings with
      microsecond precision. Identifiers are server-generated UUIDs.
    - Unknown request properties are rejected with `400`.
    - Errors use RFC 9457 Problem Details (`application/problem+json`).
    - Collections use zero-based offset pagination (`page`, `size` <= 100).
    - Execution transitions (claiming, heartbeats, results, recovery, evaluation)
      are not exposed over HTTP: they belong to authenticated workers and the
      control-plane supervisor, through the database execution protocol
      (ADR-0007). The only user-facing transition is cancellation.
    - `executionStatus` and `securityDecision` are independent. Completing
      execution never implies `PASS`; without a policy evaluation a completed
      scan is `INCOMPLETE`, and `decisionReason` says why.
    - Security policies (ADR-0013): a scan is pinned to the policy version in
      force for its project when it is requested, and evaluated by the
      supervisor against the evidence of record. `PASS` means the policy's
      requirements were met, including the limitations it explicitly accepts;
      it is not a statement that the project is secure. Precedence: any
      violation is `FAIL`, otherwise any incomplete reason is `INCOMPLETE`.
    - Historical re-evaluation (ADR-0014): a completed scan's persisted evidence
      of record can be re-evaluated under an explicitly chosen policy version.
      The result is an additional, immutable, non-gating record; the scan's
      decision, pinned policy and original evaluation never change, and no
      scanner runs.
servers:
  - url: http://127.0.0.1:8080
    description: Local development (loopback only, `local` profile)
security:
  - bearerAuth: []
tags:
  - name: Identity
  - name: Organizations
  - name: Memberships
  - name: Projects
  - name: Scans
  - name: Policies

paths:
  /api/v1/organizations:
    post:
      tags: [Organizations]
      operationId: createOrganization
      summary: Register an organization
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '../schemas/v1/create-organization-request.schema.json'
            example:
              name: Acme Security
              slug: acme-security
      responses:
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '201':
          description: Organization created.
          headers:
            Location:
              $ref: '#/components/headers/Location'
          content:
            application/json:
              schema:
                $ref: '../schemas/v1/organization.schema.json'
              example:
                id: 0b8f6a0e-6f2b-4d55-9a8b-2c0c4b3f1d10
                name: Acme Security
                slug: acme-security
                createdAt: '2026-10-09T12:00:00.123456Z'
                updatedAt: '2026-10-09T12:00:00.123456Z'
        '400':
          $ref: '#/components/responses/BadRequest'
        '409':
          $ref: '#/components/responses/Conflict'

  /api/v1/organizations/{organizationId}:
    parameters:
      - $ref: '#/components/parameters/OrganizationId'
    get:
      tags: [Organizations]
      operationId: getOrganization
      summary: Get an organization
      responses:
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '200':
          description: The organization.
          content:
            application/json:
              schema:
                $ref: '../schemas/v1/organization.schema.json'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'

  /api/v1/organizations/{organizationId}/projects:
    parameters:
      - $ref: '#/components/parameters/OrganizationId'
    post:
      tags: [Projects]
      operationId: createProject
      summary: Register a GitHub repository as a project
      description: |
        The repository is identified by owner and name only; URLs are not
        accepted. Owner and name are normalized to lowercase. A repository can be
        registered once per organization (case-insensitive). No repository is
        cloned or executed.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '../schemas/v1/create-project-request.schema.json'
            example:
              name: Payments Service
              repositoryProvider: GITHUB
              repositoryOwner: Acme-Corp
              repositoryName: payments-service
              defaultBranch: main
      responses:
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '201':
          description: Project created.
          headers:
            Location:
              $ref: '#/components/headers/Location'
          content:
            application/json:
              schema:
                $ref: '../schemas/v1/project.schema.json'
              example:
                id: 6d1f0a52-3c1e-4b8e-8f0e-1a2b3c4d5e6f
                organizationId: 0b8f6a0e-6f2b-4d55-9a8b-2c0c4b3f1d10
                name: Payments Service
                repositoryProvider: GITHUB
                repositoryOwner: acme-corp
                repositoryName: payments-service
                defaultBranch: main
                enabled: true
                createdAt: '2026-10-09T12:01:00.000001Z'
                updatedAt: '2026-10-09T12:01:00.000001Z'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
    get:
      tags: [Projects]
      operationId: listProjects
      summary: List the projects of an organization
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Size'
      responses:
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '200':
          description: A page of projects, oldest first.
          content:
            application/json:
              schema:
                $ref: '../schemas/v1/project-page.schema.json'
              example:
                items:
                  - id: 6d1f0a52-3c1e-4b8e-8f0e-1a2b3c4d5e6f
                    organizationId: 0b8f6a0e-6f2b-4d55-9a8b-2c0c4b3f1d10
                    name: Payments Service
                    repositoryProvider: GITHUB
                    repositoryOwner: acme-corp
                    repositoryName: payments-service
                    defaultBranch: main
                    enabled: true
                    createdAt: '2026-10-09T12:01:00.000001Z'
                    updatedAt: '2026-10-09T12:01:00.000001Z'
                page:
                  number: 0
                  size: 20
                  totalElements: 1
                  totalPages: 1
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'

  /api/v1/projects/{projectId}:
    parameters:
      - $ref: '#/components/parameters/ProjectId'
    get:
      tags: [Projects]
      operationId: getProject
      summary: Get a project
      responses:
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '200':
          description: The project.
          content:
            application/json:
              schema:
                $ref: '../schemas/v1/project.schema.json'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'

  /api/v1/projects/{projectId}/scans:
    parameters:
      - $ref: '#/components/parameters/ProjectId'
    post:
      tags: [Scans]
      operationId: requestScan
      summary: Queue a security scan of one commit
      description: |
        Queues a scan; it does not perform one. The response is `202 Accepted`
        with the scan in `QUEUED` / `PENDING` state.

        **Idempotency.** Send an `Idempotency-Key` to make retries safe. Keys are
        scoped to the project and enforced by a database unique constraint:
        - same key and same request: the original scan is returned again
          (`Idempotent-Replayed: true`, current state of that scan);
        - same key with a different request: `422`;
        - concurrent requests with the same key create at most one scan.

        Requests without a key always create a new scan. Keys do not expire yet.
      parameters:
        - name: Idempotency-Key
          in: header
          required: false
          schema:
            type: string
            minLength: 1
            maxLength: 128
            pattern: '^[A-Za-z0-9._:-]{1,128}$'
          example: gh-run-123456789-attempt-1
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '../schemas/v1/scan-request.schema.json'
            example:
              commitSha: 4f2c8e1d9b7a6c5e3f1a2b4c6d8e0f1a3b5c7d9e
              branch: feature/login
              triggerType: PULL_REQUEST
      responses:
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '202':
          description: Scan queued (or an idempotent replay of an earlier request).
          headers:
            Location:
              $ref: '#/components/headers/Location'
            Idempotent-Replayed:
              description: '`true` when the response replays an earlier request with the same Idempotency-Key.'
              schema:
                type: string
                enum: ['true', 'false']
          content:
            application/json:
              schema:
                $ref: '../schemas/v1/scan.schema.json'
              example:
                id: 9a7e5c3b-1d2f-4a6b-8c0d-2e4f6a8b0c1d
                projectId: 6d1f0a52-3c1e-4b8e-8f0e-1a2b3c4d5e6f
                commitSha: 4f2c8e1d9b7a6c5e3f1a2b4c6d8e0f1a3b5c7d9e
                branch: feature/login
                triggerType: PULL_REQUEST
                executionStatus: QUEUED
                securityDecision: PENDING
                decisionReason: null
                requestedAt: '2026-10-09T12:02:00.5Z'
                startedAt: null
                deadlineAt: null
                completedAt: null
                jobs: []
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          description: The Idempotency-Key was already used for a different request.
          content:
            application/problem+json:
              schema:
                $ref: '../schemas/v1/problem-details.schema.json'
              example:
                type: urn:sentinelpipe:problem:idempotency-key-reused
                title: Idempotency key reused
                status: 422
                detail: The Idempotency-Key was already used for a different request.
                instance: /api/v1/projects/6d1f0a52-3c1e-4b8e-8f0e-1a2b3c4d5e6f/scans
    get:
      tags: [Scans]
      operationId: listScans
      summary: List the scans of a project
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Size'
      responses:
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '200':
          description: A page of scans, newest first.
          content:
            application/json:
              schema:
                $ref: '../schemas/v1/scan-page.schema.json'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'

  /api/v1/projects/{projectId}/scans/{scanId}/cancel:
    parameters:
      - $ref: '#/components/parameters/ProjectId'
      - name: scanId
        in: path
        required: true
        schema:
          type: string
          format: uuid
    post:
      tags: [Scans]
      operationId: cancelScan
      summary: Cancel a scan
      description: |
        Cancels a scan that has not finished (MEMBER or above). The scan becomes
        `CANCELLED` with decision `INCOMPLETE` (`decisionReason: CANCELLED_BY_USER`)
        and its unfinished jobs are cancelled. A worker executing one of them is
        told on its next heartbeat (within 15 seconds by default) and its result is
        rejected. The cancellation is audited with the caller's identity.

        Idempotent: cancelling a cancelled scan returns it unchanged. The scan must
        belong to the project in the path; otherwise, and for non-members, `404`.
        A `COMPLETED` or `FAILED` scan cannot be cancelled (`409`,
        `code: scan-not-cancellable`). No request body.
      responses:
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '200':
          description: The scan, now cancelled.
          content:
            application/json:
              schema:
                $ref: '../schemas/v1/scan.schema.json'
              example:
                id: 9a7e5c3b-1d2f-4a6b-8c0d-2e4f6a8b0c1d
                projectId: 6d1f0a52-3c1e-4b8e-8f0e-1a2b3c4d5e6f
                commitSha: 4f2c8e1d9b7a6c5e3f1a2b4c6d8e0f1a3b5c7d9e
                branch: feature/login
                triggerType: PULL_REQUEST
                executionStatus: CANCELLED
                securityDecision: INCOMPLETE
                decisionReason: CANCELLED_BY_USER
                requestedAt: '2026-10-09T12:02:00.5Z'
                startedAt: '2026-10-09T12:02:05Z'
                deadlineAt: '2026-10-09T12:17:05Z'
                completedAt: '2026-10-09T12:03:10Z'
                jobs:
                  - id: 3c5e7a9b-0d1f-4e2a-9b3c-5d7e9f1a3b5c
                    scanId: 9a7e5c3b-1d2f-4a6b-8c0d-2e4f6a8b0c1d
                    scannerType: FIXTURE
                    executionStatus: CANCELLED
                    attemptCount: 1
                    failureReason: null
                    createdAt: '2026-10-09T12:02:01Z'
                    startedAt: '2026-10-09T12:02:05Z'
                    completedAt: '2026-10-09T12:03:10Z'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'

  /api/v1/scans/{scanId}:
    parameters:
      - name: scanId
        in: path
        required: true
        schema:
          type: string
          format: uuid
    get:
      tags: [Scans]
      operationId: getScan
      summary: Get a scan and its scanner jobs
      responses:
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '200':
          description: The scan.
          content:
            application/json:
              schema:
                $ref: '../schemas/v1/scan.schema.json'
              example:
                id: 9a7e5c3b-1d2f-4a6b-8c0d-2e4f6a8b0c1d
                projectId: 6d1f0a52-3c1e-4b8e-8f0e-1a2b3c4d5e6f
                commitSha: 4f2c8e1d9b7a6c5e3f1a2b4c6d8e0f1a3b5c7d9e
                branch: feature/login
                triggerType: PULL_REQUEST
                executionStatus: COMPLETED
                securityDecision: FAIL
                decisionReason: POLICY_EVALUATED
                requestedAt: '2026-10-09T12:02:00.5Z'
                startedAt: '2026-10-09T12:02:05Z'
                deadlineAt: '2026-10-09T12:17:05Z'
                completedAt: '2026-10-09T12:04:30Z'
                jobs:
                  - id: 3c5e7a9b-0d1f-4e2a-9b3c-5d7e9f1a3b5c
                    scanId: 9a7e5c3b-1d2f-4a6b-8c0d-2e4f6a8b0c1d
                    scannerType: SEMGREP
                    executionStatus: COMPLETED
                    attemptCount: 1
                    failureReason: null
                    createdAt: '2026-10-09T12:02:01Z'
                    startedAt: '2026-10-09T12:02:06Z'
                    completedAt: '2026-10-09T12:04:00Z'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'

  /api/v1/organizations/{organizationId}/policies:
    parameters:
      - $ref: '#/components/parameters/OrganizationId'
    post:
      tags: [Policies]
      operationId: createPolicyVersion
      summary: Create a new immutable version of a security policy (ADMIN)
      description: |
        The body is a policy.v1 definition. It is parsed strictly (duplicate keys
        and trailing content are refused), validated against the closed schema
        (unknown fields, severities outside each scanner's own scale, limitations
        a policy may never accept, and out-of-range values are rejected) and
        stored in canonical form. `definitionSha256` is the SHA-256 of that
        canonical text, so equivalent definitions have the same digest.

        The version number is the next one for the definition's `name` in the
        organization. Creating a version does **not** put it in force; see
        `PUT /api/v1/projects/{projectId}/policy`. Validation errors never echo
        submitted values.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '../schemas/v1/policy-definition.schema.json'
            example:
              schema_version: 1
              name: secrets
              evidence:
                findings_schema_versions: [1]
                max_age_seconds: 86400
              scanners:
                GITLEAKS:
                  require_complete_coverage: true
                  accepted_limitations: [ARCHIVES_NOT_SCANNED, COMMIT_NOT_VERIFIED, GIT_HISTORY_NOT_SCANNED, RULESET_DEFAULT_ONLY]
                  max_blocking_findings: 0
      responses:
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '201':
          description: The created policy version.
          headers:
            Location:
              $ref: '#/components/headers/Location'
          content:
            application/json:
              schema:
                $ref: '../schemas/v1/policy-version.schema.json'
              example:
                id: 5b0c7f1e-2a3d-4c5b-8e9f-0a1b2c3d4e5f
                policyId: 1e2d3c4b-5a69-4788-9a0b-1c2d3e4f5a6b
                organizationId: 0b8f6a0e-6f2b-4d55-9a8b-2c0c4b3f1d10
                name: secrets
                version: 1
                schemaVersion: 1
                definitionSha256: 67701e93f61056495efaf430c3cc143715d21b7584c6328ef6dd1c67b6a0bdfd
                definition:
                  evidence:
                    findings_schema_versions: [1]
                    max_age_seconds: 86400
                  name: secrets
                  scanners:
                    GITLEAKS:
                      accepted_limitations: [ARCHIVES_NOT_SCANNED, COMMIT_NOT_VERIFIED, GIT_HISTORY_NOT_SCANNED, RULESET_DEFAULT_ONLY]
                      max_blocking_findings: 0
                      require_complete_coverage: true
                  schema_version: 1
                createdAt: '2026-10-11T12:00:00.123456Z'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'

  /api/v1/policy-versions/{policyVersionId}:
    parameters:
      - $ref: '#/components/parameters/PolicyVersionId'
    get:
      tags: [Policies]
      operationId: getPolicyVersion
      summary: Get a policy version (any member of the owning organization)
      responses:
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '200':
          description: The policy version.
          content:
            application/json:
              schema:
                $ref: '../schemas/v1/policy-version.schema.json'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'

  /api/v1/projects/{projectId}/policy:
    parameters:
      - $ref: '#/components/parameters/ProjectId'
    put:
      tags: [Policies]
      operationId: activateProjectPolicy
      summary: Put a policy version in force for a project (OWNER)
      description: |
        Activation is owner-only, separate from drafting versions (ADMIN), because
        it can weaken the security gate. The version must belong to the project's
        organization; a version of another organization is reported as `404`,
        exactly like one that does not exist. Activating the version already in
        force is a no-op. Scans requested afterwards are pinned to this version;
        earlier scans keep the version they were pinned to. Every activation is
        kept in an append-only history.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '../schemas/v1/assign-project-policy-request.schema.json'
            example:
              policyVersionId: 5b0c7f1e-2a3d-4c5b-8e9f-0a1b2c3d4e5f
      responses:
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '200':
          description: The policy version now in force for the project.
          content:
            application/json:
              schema:
                $ref: '../schemas/v1/project-policy.schema.json'
              example:
                projectId: 6d1f0a52-3c1e-4b8e-8f0e-1a2b3c4d5e6f
                policyVersionId: 5b0c7f1e-2a3d-4c5b-8e9f-0a1b2c3d4e5f
                policyId: 1e2d3c4b-5a69-4788-9a0b-1c2d3e4f5a6b
                name: secrets
                version: 1
                definitionSha256: 67701e93f61056495efaf430c3cc143715d21b7584c6328ef6dd1c67b6a0bdfd
                assignedAt: '2026-10-11T12:01:00.5Z'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
    get:
      tags: [Policies]
      operationId: getProjectPolicy
      summary: Get the policy version in force for a project
      responses:
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '200':
          description: The policy version in force.
          content:
            application/json:
              schema:
                $ref: '../schemas/v1/project-policy.schema.json'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'

  /api/v1/scans/{scanId}/evaluation:
    parameters:
      - name: scanId
        in: path
        required: true
        schema:
          type: string
          format: uuid
    get:
      tags: [Policies]
      operationId: getScanEvaluation
      summary: Get the policy evaluation record of a scan
      description: |
        The immutable record that produced a policy-pinned scan's decision: the
        pinned policy version and digest, the engine version, the decision and
        its structured reasons, and the evidence of record it relied on, by
        digest. Evaluation itself is never triggered over HTTP; the control-plane
        supervisor evaluates scans once execution has finished. Scans without a
        policy have no evaluation record (`404`) and are `INCOMPLETE`
        (`POLICY_EVALUATION_UNAVAILABLE`).
      responses:
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '200':
          description: The evaluation record.
          content:
            application/json:
              schema:
                $ref: '../schemas/v1/policy-evaluation.schema.json'
              example:
                id: 7c9e1a3b-5d7f-4b1c-8e2a-4c6e8a0b2d4f
                scanId: 9a7e5c3b-1d2f-4a6b-8c0d-2e4f6a8b0c1d
                projectId: 6d1f0a52-3c1e-4b8e-8f0e-1a2b3c4d5e6f
                policyVersionId: 5b0c7f1e-2a3d-4c5b-8e9f-0a1b2c3d4e5f
                policySha256: 67701e93f61056495efaf430c3cc143715d21b7584c6328ef6dd1c67b6a0bdfd
                engineVersion: sentinelpipe-policy/1.0.0
                decision: FAIL
                violationCount: 1
                incompleteCount: 1
                reasons:
                  - code: BLOCKING_FINDINGS_EXCEEDED
                    effect: VIOLATION
                    scanner: GITLEAKS
                    subject: null
                    observed: 2
                    limit: 0
                  - code: REQUIRED_SCANNER_NOT_PLANNED
                    effect: INCOMPLETE
                    scanner: TRIVY
                    subject: null
                    observed: null
                    limit: null
                evidence:
                  - jobId: 3c5e7a9b-0d1f-4e2a-9b3c-5d7e9f1a3b5c
                    scannerType: GITLEAKS
                    leaseEpoch: 1
                    name: findings.json
                    sha256: 2f1b8519c42b5085a2e3e6a4a70417fc2f1b8519c42b5085a2e3e6a4a70417fc
                    resultSha256: 9f2b5c0d1e4a7b8c3d6e9f0a1b2c3d4e5f6a7b8c9d0e1f2a3b4c5d6e7f8a9b0c
                evaluatedAt: '2026-10-11T12:04:30.25Z'
                recordedAt: '2026-10-11T12:04:30.25Z'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'

  /api/v1/scans/{scanId}/reevaluations:
    parameters:
      - $ref: '#/components/parameters/ScanId'
    post:
      tags: [Policies]
      operationId: reevaluateScan
      summary: Re-evaluate a completed scan under an explicit policy version (OWNER, ADMIN)
      description: |
        Evaluates the scan's persisted evidence of record with the same engine and
        decision semantics as the original evaluation (FAIL > INCOMPLETE > PASS),
        under the requested policy version, as of the original decision time. Any
        stored version of the scan's organization is eligible, whether or not it
        was ever active. The result is a new, immutable, **non-gating** record
        (`evaluationType: HISTORICAL`, `gating: false`): the scan's decision,
        pinned policy, jobs and original evaluation never change, no scanner runs
        and no message is published. The body names only the policy version;
        evidence or findings are never accepted from the caller.

        Idempotent: the record's identity is the scan, the policy version, the
        engine version and a fingerprint of the evidence of record. Repeating a
        request returns the existing record (`200`, `Idempotent-Replayed: true`);
        if the evidence changed (for example, content purged by retention), a new
        record is written. At most 100 historical records per scan.

        `409` codes: `scan-not-completed`, `policy-version-unusable` (the stored
        version no longer validates), `reevaluation-limit-reached`,
        `evaluation-inputs-changed` (retry).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '../schemas/v1/reevaluation-request.schema.json'
            example:
              policyVersionId: 5b0c7f1e-2a3d-4c5b-8e9f-0a1b2c3d4e5f
      responses:
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '201':
          description: A new historical evaluation was recorded.
          headers:
            Location:
              $ref: '#/components/headers/Location'
            Idempotent-Replayed:
              $ref: '#/components/headers/IdempotentReplayed'
          content:
            application/json:
              schema:
                $ref: '../schemas/v1/scan-evaluation.schema.json'
              example:
                id: 2d4f6a8c-0e1b-4d3f-9a5c-7e9b1d3f5a7c
                evaluationType: HISTORICAL
                gating: false
                scanId: 9a7e5c3b-1d2f-4a6b-8c0d-2e4f6a8b0c1d
                projectId: 6d1f0a52-3c1e-4b8e-8f0e-1a2b3c4d5e6f
                policyVersionId: 8e0a2c4e-6f1b-4d3a-8c5e-0b2d4f6a8c1e
                policySha256: 3b5d7f9a1c2e4f6a8b0c2d4e6f8a0b1c3d5e7f9a1b3c5d7e9f0a2b4c6d8e0f1a
                engineVersion: sentinelpipe-policy/1.0.0
                decision: FAIL
                violationCount: 1
                incompleteCount: 0
                reasons:
                  - code: BLOCKING_FINDINGS_EXCEEDED
                    effect: VIOLATION
                    scanner: SEMGREP
                    subject: null
                    observed: 1
                    limit: 0
                evidence:
                  - jobId: 3c5e7a9b-0d1f-4e2a-9b3c-5d7e9f1a3b5c
                    scannerType: SEMGREP
                    leaseEpoch: 1
                    name: findings.json
                    sha256: 2f1b8519c42b5085a2e3e6a4a70417fc2f1b8519c42b5085a2e3e6a4a70417fc
                    resultSha256: 9f2b5c0d1e4a7b8c3d6e9f0a1b2c3d4e5f6a7b8c9d0e1f2a3b4c5d6e7f8a9b0c
                evaluatedAt: '2026-10-11T12:04:30.25Z'
                recordedAt: '2026-10-11T15:20:00.5Z'
                initiatedBy: user:4a6c8e0b-2d4f-4b6a-8c0e-2f4a6c8e0b2d
                inputsSha256: 7d9f1b3c5e7a9c1e3a5c7e9b1d3f5a7c9e1b3d5f7a9c1e3b5d7f9a1c3e5b7d9f
        '200':
          description: The same re-evaluation was recorded before; nothing was written.
          headers:
            Location:
              $ref: '#/components/headers/Location'
            Idempotent-Replayed:
              $ref: '#/components/headers/IdempotentReplayed'
          content:
            application/json:
              schema:
                $ref: '../schemas/v1/scan-evaluation.schema.json'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'

  /api/v1/scans/{scanId}/evaluations:
    parameters:
      - $ref: '#/components/parameters/ScanId'
    get:
      tags: [Policies]
      operationId: listScanEvaluations
      summary: List a scan's evaluation history
      description: |
        The original (gating) evaluation, if any, and every historical
        re-evaluation, oldest first. Records are returned as stored; nothing is
        recalculated when read. Raw evidence and finding content are never
        returned, only digests and structured reasons.
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Size'
      responses:
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '200':
          description: A page of evaluation records.
          content:
            application/json:
              schema:
                $ref: '../schemas/v1/scan-evaluation-page.schema.json'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'

  /api/v1/scans/{scanId}/evaluations/{evaluationId}:
    parameters:
      - $ref: '#/components/parameters/ScanId'
      - name: evaluationId
        in: path
        required: true
        schema:
          type: string
          format: uuid
    get:
      tags: [Policies]
      operationId: getScanEvaluationHistoryEntry
      summary: Get one record of a scan's evaluation history
      description: |
        An original or historical evaluation of this scan. A record of another
        scan is reported as not found.
      responses:
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '200':
          description: The evaluation record.
          content:
            application/json:
              schema:
                $ref: '../schemas/v1/scan-evaluation.schema.json'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'

  /api/v1/me:
    get:
      tags: [Identity]
      operationId: getCurrentUser
      summary: Get the authenticated caller and their organization roles
      responses:
        '401':
          $ref: '#/components/responses/Unauthorized'
        '200':
          description: The caller's identity and server-side memberships.
          content:
            application/json:
              schema:
                $ref: '../schemas/v1/current-user.schema.json'
              example:
                issuer: https://idp.example.com/realms/sentinel
                subject: 8f14e45f-ceea-467a-9b36-0d3c3a2f1e11
                platformAdmin: false
                memberships:
                  - organizationId: 0b8f6a0e-6f2b-4d55-9a8b-2c0c4b3f1d10
                    role: ADMIN

  /api/v1/organizations/{organizationId}/members:
    parameters:
      - $ref: '#/components/parameters/OrganizationId'
    get:
      tags: [Memberships]
      operationId: listMemberships
      summary: List the members of an organization (OWNER, ADMIN)
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Size'
      responses:
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '200':
          description: A page of memberships, oldest first.
          content:
            application/json:
              schema:
                $ref: '../schemas/v1/membership-page.schema.json'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
    post:
      tags: [Memberships]
      operationId: grantMembership
      summary: Grant an organization role to a user (OWNER any role; ADMIN only MEMBER/VIEWER)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '../schemas/v1/create-membership-request.schema.json'
            example:
              subject: 8f14e45f-ceea-467a-9b36-0d3c3a2f1e11
              role: MEMBER
      responses:
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '201':
          description: Membership created.
          headers:
            Location:
              $ref: '#/components/headers/Location'
          content:
            application/json:
              schema:
                $ref: '../schemas/v1/membership.schema.json'
              example:
                id: 5b7d9f1a-3c5e-4a7b-9d1f-3a5c7e9b1d3f
                organizationId: 0b8f6a0e-6f2b-4d55-9a8b-2c0c4b3f1d10
                issuer: https://idp.example.com/realms/sentinel
                subject: 8f14e45f-ceea-467a-9b36-0d3c3a2f1e11
                role: MEMBER
                createdAt: '2026-10-09T12:03:00Z'
                updatedAt: '2026-10-09T12:03:00Z'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'

  /api/v1/organizations/{organizationId}/members/{membershipId}:
    parameters:
      - $ref: '#/components/parameters/OrganizationId'
      - $ref: '#/components/parameters/MembershipId'
    get:
      tags: [Memberships]
      operationId: getMembership
      summary: Get a membership (OWNER, ADMIN)
      responses:
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '200':
          description: The membership.
          content:
            application/json:
              schema:
                $ref: '../schemas/v1/membership.schema.json'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
    put:
      tags: [Memberships]
      operationId: changeMembershipRole
      summary: Change another member's role
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '../schemas/v1/update-membership-request.schema.json'
            example:
              role: VIEWER
      responses:
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '200':
          description: The updated membership.
          content:
            application/json:
              schema:
                $ref: '../schemas/v1/membership.schema.json'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
    delete:
      tags: [Memberships]
      operationId: revokeMembership
      summary: Revoke another member's membership
      responses:
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '204':
          description: Membership revoked.
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: |
        Access token (RFC 9068 `at+jwt` by default) from the configured OIDC
        provider, sent in the `Authorization` header only. Query-parameter and
        form-body tokens are not accepted.
  parameters:
    OrganizationId:
      name: organizationId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    MembershipId:
      name: membershipId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    PolicyVersionId:
      name: policyVersionId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    ScanId:
      name: scanId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    ProjectId:
      name: projectId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    Page:
      name: page
      in: query
      required: false
      description: Zero-based page number.
      schema:
        type: integer
        minimum: 0
        maximum: 10000
        default: 0
    Size:
      name: size
      in: query
      required: false
      description: Page size.
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 20

  headers:
    Location:
      description: Relative URI of the created or queued resource.
      schema:
        type: string
        format: uri-reference
    IdempotentReplayed:
      description: '`true` when the response returns a previously recorded result and nothing was written.'
      schema:
        type: string
        enum: ['true', 'false']

  responses:
    Unauthorized:
      description: Missing or invalid bearer token. The reason is never disclosed.
      headers:
        WWW-Authenticate:
          description: '`Bearer`, or `Bearer error="invalid_token"` when a token was presented.'
          schema:
            type: string
      content:
        application/problem+json:
          schema:
            $ref: '../schemas/v1/problem-details.schema.json'
          example:
            type: urn:sentinelpipe:problem:unauthorized
            title: Unauthorized
            status: 401
            detail: A valid bearer access token is required.
            instance: /api/v1/organizations
    Forbidden:
      description: |
        The caller is a member of the organization but their role does not permit
        the operation (`insufficient-role`, `role-escalation`,
        `self-modification`), or a non-administrator tried to create an
        organization (`platform-admin-required`). Non-members receive `404`.
      content:
        application/problem+json:
          schema:
            $ref: '../schemas/v1/problem-details.schema.json'
          example:
            type: urn:sentinelpipe:problem:forbidden
            title: Forbidden
            status: 403
            detail: Your organization role does not permit this operation.
            instance: /api/v1/organizations/0b8f6a0e-6f2b-4d55-9a8b-2c0c4b3f1d10/projects
            code: insufficient-role
    BadRequest:
      description: Invalid input (validation error, malformed JSON, unknown property, or malformed path/query parameter).
      content:
        application/problem+json:
          schema:
            $ref: '../schemas/v1/problem-details.schema.json'
          example:
            type: urn:sentinelpipe:problem:validation-error
            title: Validation failed
            status: 400
            detail: The request contains invalid values.
            instance: /api/v1/organizations
            errors:
              - field: slug
                message: must be lowercase letters, digits or single hyphens, starting and ending with a letter or digit
    NotFound:
      description: The resource does not exist.
      content:
        application/problem+json:
          schema:
            $ref: '../schemas/v1/problem-details.schema.json'
          example:
            type: urn:sentinelpipe:problem:not-found
            title: Resource not found
            status: 404
            detail: Organization was not found.
            instance: /api/v1/organizations/0b8f6a0e-6f2b-4d55-9a8b-2c0c4b3f1d10
    Conflict:
      description: The request conflicts with existing state (see `code`).
      content:
        application/problem+json:
          schema:
            $ref: '../schemas/v1/problem-details.schema.json'
          example:
            type: urn:sentinelpipe:problem:conflict
            title: Conflict
            status: 409
            detail: An organization with this slug already exists.
            instance: /api/v1/organizations
            code: organization-slug-taken
