# Local development defaults only. Credentials have no defaults and must be
# supplied via environment variables; the application fails fast without them.
spring:
  application:
    name: sentinel-api
  datasource:
    url: jdbc:postgresql://${SENTINEL_DB_HOST:localhost}:${SENTINEL_DB_PORT:5432}/${SENTINEL_DB_NAME:sentinelpipe}
    username: ${SENTINEL_DB_USERNAME:sentinel}
    password: ${SENTINEL_DB_PASSWORD}
  jpa:
    open-in-view: false
    hibernate:
      # Flyway owns the schema; Hibernate only validates it.
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration
  rabbitmq:
    host: ${SENTINEL_RABBITMQ_HOST:localhost}
    port: ${SENTINEL_RABBITMQ_PORT:5672}
    # Least-privileged publisher identity (write sentinel.scan-requests only), created by
    # infrastructure/docker/rabbitmq/provision.sh. Never the broker administrator.
    username: ${SENTINEL_RABBITMQ_USERNAME:sentinel-publisher}
    password: ${SENTINEL_RABBITMQ_PASSWORD}
    virtual-host: ${SENTINEL_RABBITMQ_VHOST:/}
    # Outbox publication: an event is marked PUBLISHED only after a positive,
    # correlated publisher confirm for a message that was not returned as
    # unroutable (mandatory flag). See OutboxPublisher and ADR-0004.
    publisher-confirm-type: correlated
    publisher-returns: true
    connection-timeout: 5s
    template:
      mandatory: true
  mvc:
    problemdetails:
      # Framework-level errors are rendered as RFC 9457 Problem Details.
      enabled: true
  web:
    resources:
      # The API serves no static content; unknown paths are plain 404s.
      add-mappings: false
  jackson:
    deserialization:
      # Reject unexpected request properties instead of silently ignoring them.
      fail-on-unknown-properties: true

server:
  error:
    include-stacktrace: never
    include-message: never
    include-binding-errors: never
    include-exception: false

sentinel:
  domain-api:
    # The domain REST API (/api/v1) is disabled by default: its controllers are not
    # registered and every non-health request is denied. Enabling it requires valid JWT
    # settings (below), a literal loopback server.address, and no prod/production
    # profile (see DomainApiExposureGuard, ADR-0002 and ADR-0003). Use the `local`
    # profile for development.
    enabled: false
  # Identity (M2 Phase 2A). Required whenever the domain API is enabled; startup fails
  # if incomplete. Supply via environment variables, e.g.:
  #   SENTINEL_SECURITY_JWT_ISSUER            exact `iss` of the OIDC provider
  #   SENTINEL_SECURITY_JWT_AUDIENCE          value required in `aud`
  #   SENTINEL_SECURITY_JWT_JWK_SET_URI       provider JWKS endpoint (https)
  #   SENTINEL_SECURITY_PLATFORM_ADMIN_SUBJECTS  comma-separated `sub` values allowed
  #                                           to create organizations (bootstrap)
  # No shared secrets are supported: tokens must be signed with the provider's
  # asymmetric keys. See ADR-0003.
  # Transactional outbox and RabbitMQ topology (M2 Phase 2B, ADR-0004).
  messaging:
    # Topology is provisioned out of band (provision.sh imports definitions.json) with
    # administrative credentials; the runtime publisher has no configure permission.
    # Enable only with an administrative broker user (tests, throwaway brokers).
    declare-topology: false
    outbox:
      publisher-enabled: true
      poll-interval-ms: 1000
      batch-size: 50
      lease-duration: 60s
      max-attempts: 8
      backoff-initial: 2s
      backoff-max: 5m
      confirm-timeout: 10s
      # The `outbox` health contributor is DOWN beyond this age (not part of readiness).
      max-pending-age: 15m
  # Idempotency-Key lifecycle (IdempotencyProperties): keys replay for `retention`, then
  # expire; expired keys are released by a bounded periodic cleanup. Scans are never deleted.
  idempotency:
    retention: 24h
    cleanup-enabled: true
    cleanup-interval: 10m
    cleanup-batch-size: 500
    cleanup-max-batches: 20
  security:
    jwt:
      jws-algorithms: RS256
      token-types: at+jwt
      clock-skew: 30s

management:
  # Only health is exposed. Exposing `prometheus` requires a separate management port bound
  # to a loopback address (MetricsExposureGuard), e.g.
  #   MANAGEMENT_SERVER_PORT=9464 MANAGEMENT_SERVER_ADDRESS=127.0.0.1
  #   MANAGEMENT_ENDPOINTS_WEB_EXPOSURE_INCLUDE=health,prometheus
  # See docs/runbooks/observability.md.
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never
      probes:
        enabled: true
