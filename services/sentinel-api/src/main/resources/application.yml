# Local development defaults only. Credentials have no defaults and must be
# supplied via environment variables; the application fails fast without them.
spring:
  application:
    name: sentinel-api
  datasource:
    url: jdbc:postgresql://${SENTINEL_DB_HOST:localhost}:${SENTINEL_DB_PORT:5432}/${SENTINEL_DB_NAME:sentinelpipe}
    username: ${SENTINEL_DB_USERNAME:sentinel}
    password: ${SENTINEL_DB_PASSWORD}
  jpa:
    open-in-view: false
    hibernate:
      # Flyway owns the schema; Hibernate only validates it.
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration
  rabbitmq:
    host: ${SENTINEL_RABBITMQ_HOST:localhost}
    port: ${SENTINEL_RABBITMQ_PORT:5672}
    username: ${SENTINEL_RABBITMQ_USERNAME:sentinel}
    password: ${SENTINEL_RABBITMQ_PASSWORD}
    virtual-host: ${SENTINEL_RABBITMQ_VHOST:/}
  mvc:
    problemdetails:
      # Framework-level errors are rendered as RFC 9457 Problem Details.
      enabled: true
  web:
    resources:
      # The API serves no static content; unknown paths are plain 404s.
      add-mappings: false
  jackson:
    deserialization:
      # Reject unexpected request properties instead of silently ignoring them.
      fail-on-unknown-properties: true

server:
  error:
    include-stacktrace: never
    include-message: never
    include-binding-errors: never
    include-exception: false

sentinel:
  domain-api:
    # The domain REST API (/api/v1) has NO authentication or tenant authorization yet.
    # It is disabled by default: its controllers are not registered and its routes do
    # not exist. Enabling it requires a literal loopback server.address and is refused
    # with a prod/production profile (see DomainApiExposureGuard and ADR-0002). Use the
    # `local` profile for development.
    enabled: false

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never
      probes:
        enabled: true
