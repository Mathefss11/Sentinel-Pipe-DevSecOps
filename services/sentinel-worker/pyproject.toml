[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "sentinel-worker"
dynamic = ["version"]
description = "SentinelPipe execution and processing plane worker."
requires-python = ">=3.12"
dependencies = [
    # AMQP 0-9-1 client (pure Python) for the RabbitMQ consumer.
    "pika>=1.3.2,<2",
    # Validation of messages against packages/contracts JSON Schemas (2020-12).
    "jsonschema>=4.23,<5",
    # PostgreSQL driver for the shared receipt store and operator tools (binary wheels
    # bundle libpq, so no system client library is needed).
    "psycopg[binary]>=3.3,<4",
    # Prometheus text exposition of worker metrics (off unless a port is configured).
    "prometheus-client>=0.26,<1",
]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Typing :: Typed",
]

[project.optional-dependencies]
dev = [
    "pytest>=9.1,<10",
    "ruff>=0.17,<0.18",
    # Real RabbitMQ and PostgreSQL for integration tests.
    "testcontainers[rabbitmq,postgres]>=4.13,<5",
]

[project.scripts]
sentinel-worker = "sentinel_worker.cli:main"

[tool.hatch.version]
path = "src/sentinel_worker/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/sentinel_worker"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["-ra", "--strict-markers", "--strict-config"]
markers = [
    "integration: requires Docker (real RabbitMQ and/or PostgreSQL through Testcontainers)",
]
xfail_strict = true

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "N",   # pep8-naming
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
    "S",   # flake8-bandit (security)
    "SIM", # flake8-simplify
    "PT",  # flake8-pytest-style
    "RUF", # ruff-specific rules
]

[tool.ruff.lint.per-file-ignores]
# assert is the pytest idiom; tests use deliberately fake credentials and tokens.
"tests/**" = ["S101", "S105", "S106"]
