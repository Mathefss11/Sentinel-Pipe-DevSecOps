[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "sentinel-worker"
dynamic = ["version"]
description = "SentinelPipe execution and processing plane worker."
requires-python = ">=3.12"
dependencies = []
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Typing :: Typed",
]

[project.optional-dependencies]
dev = [
    "pytest>=9.1,<10",
    "ruff>=0.17,<0.18",
]

[project.scripts]
sentinel-worker = "sentinel_worker.cli:main"

[tool.hatch.version]
path = "src/sentinel_worker/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/sentinel_worker"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["-ra", "--strict-markers", "--strict-config"]
xfail_strict = true

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "N",   # pep8-naming
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
    "S",   # flake8-bandit (security)
    "SIM", # flake8-simplify
    "PT",  # flake8-pytest-style
    "RUF", # ruff-specific rules
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]  # assert is the pytest idiom
