name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Read-only token for every job. This workflow builds and tests only; it never
# deploys, publishes, or writes to the repository.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  api:
    name: sentinel-api (Java 21)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        working-directory: services/sentinel-api
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
          cache-dependency-path: services/sentinel-api/pom.xml

      # Docker Hub rate-limits anonymous pulls per IP, and GitHub-hosted runners share
      # IPs. Authenticate when credentials are configured, pre-pull with retries, then
      # log out before any build or test code runs.
      - name: Check for Docker Hub credentials
        id: dockerhub
        env:
          DOCKERHUB_USERNAME: ${{ vars.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          if [ -n "$DOCKERHUB_USERNAME" ] && [ -n "$DOCKERHUB_TOKEN" ]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
          else
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Docker Hub credentials not configured; pulling anonymously."
          fi

      - name: Log in to Docker Hub (read-only)
        if: steps.dockerhub.outputs.configured == 'true'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # Must match TestcontainersConfiguration.java and the Ryuk image used by Testcontainers.
      - name: Pre-pull Testcontainers images
        run: >-
          sh "$GITHUB_WORKSPACE/scripts/ci/pull-images.sh"
          postgres@sha256:77f585114c32fbca283dc835b0596f4e52b51b4c6662d7810b2f4084f60a1873
          rabbitmq@sha256:3ef7f7e89fed709a78f79b8b5f4e30e1312a1d4089da752e23595566d9d61a95
          testcontainers/ryuk:0.14.0

      - name: Log out of Docker Hub
        if: always()
        run: docker logout

      # Integration tests use Testcontainers against the runner's Docker Engine.
      - name: Build and test
        run: sh ./mvnw --batch-mode --no-transfer-progress clean verify

  worker:
    name: sentinel-worker (Python ${{ matrix.python-version }})
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.14"]
    defaults:
      run:
        working-directory: services/sentinel-worker
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: services/sentinel-worker/pyproject.toml

      - name: Install
        run: python -m pip install --disable-pip-version-check -e ".[dev]"

      - name: Lint
        run: ruff check .

      - name: Check formatting
        run: ruff format --check .

      # The integration tests start real RabbitMQ and PostgreSQL through Testcontainers. See
      # the api job for why images are pulled up front with optional read-only credentials.
      - name: Check for Docker Hub credentials
        id: dockerhub
        env:
          DOCKERHUB_USERNAME: ${{ vars.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          if [ -n "$DOCKERHUB_USERNAME" ] && [ -n "$DOCKERHUB_TOKEN" ]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
          else
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Docker Hub credentials not configured; pulling anonymously."
          fi

      - name: Log in to Docker Hub (read-only)
        if: steps.dockerhub.outputs.configured == 'true'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # Must match RABBITMQ_IMAGE and POSTGRES_IMAGE in tests/integration/infrastructure.py.
      - name: Pre-pull Testcontainers images
        run: >-
          sh "$GITHUB_WORKSPACE/scripts/ci/pull-images.sh"
          rabbitmq@sha256:3ef7f7e89fed709a78f79b8b5f4e30e1312a1d4089da752e23595566d9d61a95
          postgres@sha256:77f585114c32fbca283dc835b0596f4e52b51b4c6662d7810b2f4084f60a1873

      - name: Log out of Docker Hub
        if: always()
        run: docker logout

      - name: Test
        # The runner is ephemeral, so Testcontainers' resource reaper (an extra image) is not needed.
        # Sandbox tests run in the dedicated sandbox job.
        env:
          TESTCONTAINERS_RYUK_DISABLED: "true"
        run: python -m pytest -m "not sandbox"

  sandbox:
    name: Sandbox isolation (real containers)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        working-directory: services/sentinel-worker
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: services/sentinel-worker/pyproject.toml

      - name: Install
        run: python -m pip install --disable-pip-version-check -e ".[dev]"

      # See the api job for why images are pulled up front with optional read-only credentials.
      - name: Check for Docker Hub credentials
        id: dockerhub
        env:
          DOCKERHUB_USERNAME: ${{ vars.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          if [ -n "$DOCKERHUB_USERNAME" ] && [ -n "$DOCKERHUB_TOKEN" ]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
          else
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Docker Hub credentials not configured; pulling anonymously."
          fi

      - name: Log in to Docker Hub (read-only)
        if: steps.dockerhub.outputs.configured == 'true'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # The sandbox image must match FIXTURE_IMAGE in sentinel_worker/sandbox/policy.py. Workers
      # never pull at execution time (--pull never).
      - name: Pre-pull sandbox and Testcontainers images
        run: >-
          sh "$GITHUB_WORKSPACE/scripts/ci/pull-images.sh"
          alpine@sha256:5291449c3df73caf6ed85e649dec1b9e818b39a5d8c871e97afc13e9cd5e8fa8
          postgres@sha256:77f585114c32fbca283dc835b0596f4e52b51b4c6662d7810b2f4084f60a1873
          rabbitmq@sha256:3ef7f7e89fed709a78f79b8b5f4e30e1312a1d4089da752e23595566d9d61a95

      # Logged out before any sandbox runs: no registry credential exists during the tests.
      - name: Log out of Docker Hub
        if: always()
        run: docker logout

      # Isolation controls verified from inside a real sandbox on this runner.
      - name: Sandbox self-check
        run: sentinel-worker sandbox-check

      # Isolation, limits, timeouts, cancellation, cleanup and crash recovery, plus the full
      # protocol with PostgreSQL. A missing runtime or image fails instead of skipping.
      - name: Sandbox tests
        env:
          TESTCONTAINERS_RYUK_DISABLED: "true"
          SENTINEL_REQUIRE_SANDBOX: "1"
        run: python -m pytest -m sandbox -v

      - name: No sandbox left behind
        if: always()
        run: test -z "$(docker ps --all --quiet --filter label=sentinelpipe.sandbox=1)"

  e2e:
    name: End-to-end (API → outbox → RabbitMQ → worker)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
          cache-dependency-path: services/sentinel-api/pom.xml

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: services/sentinel-worker/pyproject.toml

      - name: Install the worker
        run: python -m pip install --disable-pip-version-check ./services/sentinel-worker

      # See the api job for why images are pulled up front with optional read-only credentials.
      - name: Check for Docker Hub credentials
        id: dockerhub
        env:
          DOCKERHUB_USERNAME: ${{ vars.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          if [ -n "$DOCKERHUB_USERNAME" ] && [ -n "$DOCKERHUB_TOKEN" ]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
          else
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Docker Hub credentials not configured; pulling anonymously."
          fi

      - name: Log in to Docker Hub (read-only)
        if: steps.dockerhub.outputs.configured == 'true'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # Must match TestcontainersConfiguration.java and the Ryuk image used by Testcontainers;
      # the alpine image is the worker's sandbox image (sentinel_worker/sandbox/policy.py).
      - name: Pre-pull Testcontainers and sandbox images
        run: >-
          sh scripts/ci/pull-images.sh
          postgres@sha256:77f585114c32fbca283dc835b0596f4e52b51b4c6662d7810b2f4084f60a1873
          rabbitmq@sha256:3ef7f7e89fed709a78f79b8b5f4e30e1312a1d4089da752e23595566d9d61a95
          testcontainers/ryuk:0.14.0
          alpine@sha256:5291449c3df73caf6ed85e649dec1b9e818b39a5d8c871e97afc13e9cd5e8fa8

      - name: Log out of Docker Hub
        if: always()
        run: docker logout

      # Java scan creation, outbox publication with confirms, RabbitMQ delivery, and the real
      # Python worker process recording its receipt in PostgreSQL, verified against the
      # outbox (ScanDeliveryE2ETests); forged messages and an audited operator DLQ replay;
      # sandboxed execution, cancellation and crash recovery (ScanExecutionE2ETests).
      # The e2e profile sets failIfNoTests, so this step fails if no E2E test runs.
      - name: Run end-to-end tests
        working-directory: services/sentinel-api
        run: sh ./mvnw --batch-mode --no-transfer-progress verify -Pe2e "-Dsentinel.e2e.python=$(command -v python)"

  infrastructure:
    name: Infrastructure configuration
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      OPA_IMAGE: openpolicyagent/opa:1.21.1@sha256:d3a9a6bd4fbcb0f4403294b0d0b239b07be163ac118a46df7d50045b52e52053
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Validate Docker Compose configuration
        run: docker compose --env-file .env.example config --quiet

      # See the api job for why images are pulled up front.
      - name: Check for Docker Hub credentials
        id: dockerhub
        env:
          DOCKERHUB_USERNAME: ${{ vars.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          if [ -n "$DOCKERHUB_USERNAME" ] && [ -n "$DOCKERHUB_TOKEN" ]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
          else
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Docker Hub credentials not configured; pulling anonymously."
          fi

      - name: Log in to Docker Hub (read-only)
        if: steps.dockerhub.outputs.configured == 'true'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Pre-pull Compose images
        run: |
          set -o pipefail
          docker compose --env-file .env.example config --images | xargs sh scripts/ci/pull-images.sh

      - name: Log out of Docker Hub
        if: always()
        run: docker logout

      - name: Test OPA server authorization policy
        run: |
          docker run --rm --pull never -v "$PWD/infrastructure/docker/opa:/policies:ro" "$OPA_IMAGE" check --strict /policies
          docker run --rm --pull never -v "$PWD/infrastructure/docker/opa:/policies:ro" "$OPA_IMAGE" test /policies -v

      # Placeholder credentials from .env.example are acceptable only because this
      # stack is ephemeral, bound to loopback, and destroyed at the end of the job.
      - name: Start local stack and wait for health checks
        run: docker compose --env-file .env.example up --pull never --detach --wait --wait-timeout 180

      # The runtime identities are least-privileged; provisioning is a separate, administrative
      # step (topology import, users, permissions, database login roles).
      - name: Provision least-privileged identities
        run: sh scripts/dev/provision.sh .env.example

      - name: Verify broker permissions
        run: sh scripts/ci/verify-broker-permissions.sh .env.example

      - name: Verify database roles
        run: sh scripts/ci/verify-database-roles.sh .env.example

      - name: Show service status
        if: always()
        run: docker compose --env-file .env.example ps

      - name: Tear down
        if: always()
        run: docker compose --env-file .env.example down --volumes
